<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Order online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Shown only in demo mode (the order hub cannot be reached) -->
  <div class="demo-banner" id="demo-banner" role="alert" hidden></div>

  <!-- Header: store, delivery context and kitchen status stay visible on every page -->
  <header class="site-header" id="site-header"></header>

  <main id="app" class="app"></main>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- Mobile: bottom cart bar -->
  <div class="cart-bar" id="cart-bar" hidden></div>

  <!-- Dish options (sizes, add-ons) -->
  <div class="modal" id="modal" hidden></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/item.js"></script>
  <script src="js/pages/cart.js"></script>
  <script src="js/pages/orders.js"></script>
  <script src="js/pages/account.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
